# Config de mypy para el job sec:type-check (mypy oncology-xai/apps --ignore-missing-imports).
# Los 9 servicios definen un paquete con el mismo nombre ("app"); mypy no admite modulos
# duplicados en una sola corrida y aborta ("Duplicate module named app"). Aqui se revisa
# inference-service (el servicio mas grande); el resto se valida por servicio con
# 'cd oncology-xai/apps/<servicio> && mypy app --ignore-missing-imports' (todos en 0 errores).
# alembic/: migraciones; la carpeta local tapa al paquete alembic y da falsos [attr-defined].
[mypy]
exclude = (?x)(
    oncology-xai/apps/(active-learning-service|api-gateway|audit-service|case-service|ehr-service|graph-service|image-service|ontology-admin-service)/
    | /alembic/
    )
