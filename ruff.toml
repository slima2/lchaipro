# Configuración de Ruff para el job sec:lint (ruff check . && ruff format --check .)
# Código de investigación de la tesis: no se empaqueta en ninguna imagen ni se despliega
# (los Dockerfile solo copian apps/ y packages/).
extend-exclude = [
    "oncology-xai/Thesis",
    "oncology-xai/thesis_edits",
]

[format]
# Tablas de IRIs de ontologías (http://... de NCIt/MONDO son identificadores, no URLs de red).
# Reformatearlas las marca como código nuevo y el Quality Gate exige revisar sus hotspots S5332.
exclude = [
    "oncology-xai/apps/ehr-service/app/ner.py",
    "oncology-xai/apps/graph-service/app/sparql.py",
    "oncology-xai/apps/ontology-admin-service/app/deep_search.py",
    "oncology-xai/packages/langgraph-workflows/src/langgraph_workflows/graphs/ehr_ontology.py",
]
