{{- if .Values.layers.app }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: {{ .Values.services.webapp.replicas }}
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      containers:
        - name: webapp
          image: {{ include "lchai.svcImage" (dict "root" $ "svc" "webapp") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "lchai.containerHardening" $ }}{{ . | nindent 10 }}{{- end }}
          ports:
            - containerPort: 3000
          env:
            - name: CSP_S3_ORIGIN
              value: {{ .Values.webapp.cspS3Origin | default (ternary (regexFind "^https?://[^/]+" (include "lchai.s3Endpoint" .)) (printf "https://*.s3.amazonaws.com https://s3.%s.amazonaws.com" .Values.s3.region) (not (empty (include "lchai.s3Endpoint" .)))) | quote }}
            - name: VITE_API_URL
              value: "https://{{ .Values.domain }}"
            - name: VITE_KEYCLOAK_URL
              value: "https://{{ .Values.domain }}"
            - name: VITE_KEYCLOAK_REALM
              value: "oncology"
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: "oncology-webapp"
          {{- if .Values.podSecurity.hardened }}
          # Raíz de solo lectura: nginx escribe la configuración generada desde la plantilla, la caché y el PID
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- if .Values.podSecurity.hardened }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 8Mi
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  selector:
    app: webapp
  ports:
    - port: 3000
      targetPort: 3000
{{- end }}
