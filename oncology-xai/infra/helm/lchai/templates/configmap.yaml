apiVersion: v1
kind: ConfigMap
metadata:
  name: lchai-config
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  {{- $s3 := include "lchai.s3Endpoint" . }}
  S3_ENDPOINT: {{ $s3 | default (printf "https://s3.%s.amazonaws.com" .Values.s3.region) | quote }}
  {{- with $s3 }}
  S3_ENDPOINT_URL: {{ . | quote }}
  # image-service reescribe el host de las URL firmadas con este valor (por defecto http://localhost:9000)
  S3_ENDPOINT_EXTERNAL: {{ . | quote }}
  {{- end }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  KEYCLOAK_URL: "http://keycloak:8080"
  # Validación estricta de tokens en el gateway (S-07) y CORS (S-17)
  {{- $pub := include "lchai.effectivePublicUrl" . }}
  JWT_ISSUER: {{ .Values.auth.jwtIssuer | default (ternary (printf "%s/realms/%s" $pub .Values.keycloak.realm) "" (not (empty $pub))) | quote }}
  JWT_AUDIENCE: {{ .Values.auth.jwtAudience | default "" | quote }}
  CORS_ORIGINS: {{ .Values.auth.corsOrigins | default "" | quote }}
  KEYCLOAK_REALM: "oncology"
  KEYCLOAK_CLIENT_ID: "oncology-api"
  JWKS_URL: "http://keycloak:8080/realms/oncology/protocol/openid-connect/certs"
  FUSEKI_URL: "http://fuseki:3030"
  FUSEKI_DATASET: "oncology"
  MODEL_BACKEND: {{ .Values.inferenceWorker.modelBackend | quote }}
  V2_MAX_TILES_WSI: {{ .Values.inferenceWorker.maxTilesWsi | quote }}
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "openai"
  # Service URLs (ClusterIP)
  CASE_SERVICE_URL: "http://case-service:8001"
  IMAGE_SERVICE_URL: "http://image-service:8002"
  INFERENCE_SERVICE_URL: "http://inference-service:8003"
  EHR_SERVICE_URL: "http://ehr-service:8004"
  GRAPH_SERVICE_URL: "http://graph-service:8005"
  ONTOLOGY_ADMIN_SERVICE_URL: "http://ontology-admin-service:8006"
  AUDIT_SERVICE_URL: "http://audit-service:8007"
  ACTIVE_LEARNING_SERVICE_URL: "http://active-learning-service:8008"
