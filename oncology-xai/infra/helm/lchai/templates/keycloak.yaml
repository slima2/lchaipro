{{- if .Values.layers.platform }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args:
            {{- toYaml .Values.keycloak.args | nindent 12 }}
            {{- if .Values.keycloak.importRealm }}
            - --import-realm
            {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lchai-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lchai-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_PROXY
              value: edge
            {{- with include "lchai.effectivePublicUrl" . }}
            # URL pública fija: si no, Keycloak la arma con el puerto que le informa el ingress
            - name: KC_HOSTNAME_URL
              value: {{ . | quote }}
            - name: KC_HOSTNAME_ADMIN_URL
              value: {{ . | quote }}
            {{- end }}
          # Sin probes el pod figura listo antes de atender y el login da 502 mientras arranca.
          # La primera vez crea el esquema e importa el realm: puede tardar varios minutos.
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 20
            failureThreshold: 6
          {{- if .Values.keycloak.importRealm }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          {{- end }}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      {{- if .Values.keycloak.importRealm }}
      volumes:
        - name: realm
          configMap:
            name: lchai-keycloak-realm
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
