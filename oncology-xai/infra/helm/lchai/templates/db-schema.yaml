{{- /*
Crea o completa el esquema de la base de datos con files/init.sql (idempotente: IF NOT EXISTS). Se recrea cuando cambia el SQL, la imagen o el destino.
Los servicios no crean sus tablas ni corren Alembic al arrancar, así que sin esto una base nueva
(PostgreSQL administrado o localDeps) queda incompleta. Corre en cada instalación o upgrade.
*/ -}}
{{- if and .Values.dbSchema.enabled .Values.layers.platform }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lchai-db-schema
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # No es un hook (no bloquea helm --wait). El sufijo es un hash del SQL, la imagen y el destino: el Job
  # se recrea solo cuando cambia algo de eso. No usar .Release.Revision: bajo ArgoCD vale siempre 1 y un
  # cambio de template falla con "spec.template: field is immutable".
  name: {{ include "lchai.wl" (dict "root" $ "name" "db-schema") }}-{{ printf "%s|%s|%s|%s|%s" (.Files.Get "files/init.sql") .Values.dbSchema.image .Values.postgres.host .Values.postgres.database (.Values.postgres.sslMode | default "prefer") | sha256sum | trunc 8 }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 30
  template:
    metadata:
      labels:
        app: db-schema
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.depPodContext" (dict "gid" 70) | nindent 6 }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      restartPolicy: OnFailure
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: psql
          image: {{ .Values.dbSchema.image }}
          {{- include "lchai.depContext" (dict "uid" 70 "gid" 70) | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -q; do echo "esperando a PostgreSQL en $PGHOST:$PGPORT..."; sleep 5; done
              psql -v ON_ERROR_STOP=1 -q -f /sql/init.sql
              echo "esquema al día: $(psql -Atc "select count(*) from information_schema.tables where table_schema='public'") tablas"
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lchai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGOPTIONS
              value: "-c client_min_messages=warning"   # sin los avisos de "ya existe"
            - name: PGSSLMODE
              value: {{ .Values.postgres.sslMode | default "prefer" | quote }}
          volumeMounts:
            - name: sql
              mountPath: /sql
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: sql
          configMap:
            name: lchai-db-schema
{{- end }}
