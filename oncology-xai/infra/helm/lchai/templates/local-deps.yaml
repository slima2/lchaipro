{{- /*
Dependencias dentro del cluster (PostgreSQL, Redis y almacenamiento S3 con SeaweedFS) para entornos sin servicios administrados:
minikube o un Kubernetes on-premise. Se activan con localDeps.enabled=true. En AWS quedan apagadas.
*/ -}}
{{- if .Values.localDeps.enabled }}
{{- $d := .Values.localDeps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lchai-postgres-init
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lchai.wl" (dict "root" $ "name" "postgres") }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.depPodContext" (dict "gid" 70) | nindent 6 }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      {{- if $d.postgres.fixPermissions }}
      # Discos Lustre (CSI): initdb no puede hacer chown y fsGroup no alcanza. Un initContainer como root
      # abre los permisos del directorio de datos y postgres corre como su usuario (uid 70 en alpine).
      initContainers:
        - name: fix-permissions
          image: {{ $d.postgres.image }}
          # NO crear pgdata aqui: si lo crea root, initdb (uid 70) no es dueno y falla en chmod 700.
          # Solo se abre el padre para que initdb cree pgdata con su propio uid; un pgdata vacio huerfano de root se elimina.
          command: ["sh", "-c", "chmod a+rwx /var/lib/postgresql/data; if [ -d /var/lib/postgresql/data/pgdata ] && [ ! -f /var/lib/postgresql/data/pgdata/PG_VERSION ]; then rmdir /var/lib/postgresql/data/pgdata 2>/dev/null || true; fi"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- end }}
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: postgres
          image: {{ $d.postgres.image }}
          {{- include "lchai.depContext" (dict "uid" 70 "gid" 70) | nindent 10 }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lchai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.username }}"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: init
          configMap:
            name: lchai-postgres-init
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $d.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lchai.wl" (dict "root" $ "name" "redis") }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.depPodContext" (dict "gid" 1000) | nindent 6 }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: redis
          image: {{ $d.redis.image }}
          {{- include "lchai.depContext" (dict "uid" 999 "gid" 1000) | nindent 10 }}
          {{- if or $.Values.redis.password $.Values.secrets.existing }}
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: lchai-secrets, key: REDIS_PASSWORD }
          {{- end }}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Almacenamiento compatible con S3: SeaweedFS (Apache 2.0) sobre un volumen persistente
{{- if not .Values.secrets.existing }}
apiVersion: v1
kind: Secret
metadata:
  name: lchai-s3-config
type: Opaque
stringData:
  s3.json: |
    {"identities": [{"name": "lchai",
      "credentials": [{"accessKey": {{ .Values.s3.accessKey | quote }}, "secretKey": {{ .Values.s3.secretKey | quote }}}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lchai.wl" (dict "root" $ "name" "s3") }}
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.depPodContext" (dict "gid" 1000) | nindent 6 }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" "general") | nindent 6 }}
      {{- if .Values.storage.fixPermissions }}
      initContainers:
        {{- include "lchai.fixPermsInit" (dict "image" $d.s3.image "path" "/data" "volume" "data") | nindent 8 }}
      {{- end }}
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: seaweedfs
          image: {{ $d.s3.image }}
          {{- include "lchai.depContext" (dict "uid" 1000 "gid" 1000) | nindent 10 }}
          args:
            - server
            - -dir=/data
            # Solo el gateway S3 (con la identidad de lchai) escucha fuera del pod. Master, volume y filer no
            # piden credenciales: quedan en loopback. Iceberg (8181) y Lance (9101) no se usan: apagados.
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -s3
            - -s3.ip.bind=0.0.0.0
            - -s3.port=8333
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.telemetry=false
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=1024
            # Máximo de volúmenes lógicos (crecen según se usan); con el valor automático se agotaban
            # con dos buckets y fallaban las subidas ("Not enough data nodes found").
            - -volume.max={{ $d.s3.maxVolumes | default 100 }}
          env:
            # Crear 1 volumen por vez en lugar de 7 por bucket
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
              value: "1"
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $d.s3.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: lchai-s3-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $d.s3.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - name: api
      port: 8333
      targetPort: 8333
    {{- with $d.s3.publicPort }}
    # Mismo puerto que usa el navegador, para que las URL firmadas también funcionen dentro del cluster
    - name: public
      port: {{ . }}
      targetPort: 8333
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Recurso normal (no hook): el worker de inferencia necesita los buckets para arrancar, y un hook
  # post-install esperaría a que el worker esté listo (bloqueo mutuo con --wait).
  # El sufijo es un hash de lo que define el Job (origen CORS, buckets, imagen). No usar .Release.Revision:
  # bajo ArgoCD vale siempre 1 y un cambio de template falla con "spec.template: field is immutable".
  name: {{ include "lchai.wl" (dict "root" $ "name" "s3-buckets") }}-{{ printf "%s|%s|%s|%s|%s" (.Values.publicUrl | default (printf "https://%s" .Values.domain)) .Values.s3.bucket .Values.s3.modelsBucket $d.s3.awsCliImage (.Values.s3.region | toString) | sha256sum | trunc 8 }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 30
  template:
    metadata:
      labels:
        app: s3-buckets
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.depPodContext" (dict "gid" 1000) | nindent 6 }}
      restartPolicy: OnFailure
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: aws
          image: {{ $d.s3.awsCliImage }}
          {{- include "lchai.depContext" (dict "uid" 1000 "gid" 1000) | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              E="--endpoint-url http://s3:8333"
              until aws $E s3 ls >/dev/null 2>&1; do echo "esperando s3..."; sleep 5; done
              for b in {{ .Values.s3.bucket }} {{ .Values.s3.modelsBucket }}; do
                aws $E s3api head-bucket --bucket "$b" 2>/dev/null || aws $E s3 mb "s3://$b"
              done
              cat > /tmp/cors.json <<'JSON'
              {"CORSRules": [{"AllowedOrigins": [{{ .Values.publicUrl | default (printf "https://%s" .Values.domain) | quote }}],
                "AllowedMethods": ["GET", "PUT", "POST", "HEAD", "DELETE"],
                "AllowedHeaders": ["*"], "ExposeHeaders": ["ETag"], "MaxAgeSeconds": 3600}]}
              JSON
              aws $E s3api put-bucket-cors --bucket {{ .Values.s3.bucket }} --cors-configuration file:///tmp/cors.json || echo "aviso: CORS no aplicado"
              echo listo
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: lchai-secrets, key: S3_ACCESS_KEY }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: lchai-secrets, key: S3_SECRET_KEY }
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if and $d.s3.host (ne .Values.ingress.provider "none") }}
{{- with $d.s3.host }}
---
# S3 público: el navegador abre aquí las URL firmadas (visor de láminas y subidas grandes)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-public
  annotations:
    {{- with include "lchai.ingressAnnotations" $ }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ . | quote }}
      secretName: {{ $.Values.ingress.tls.s3SecretName | default (printf "%s-s3" $.Values.ingress.tls.secretName) | quote }}
  {{- end }}
  rules:
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3
                port:
                  number: 8333
{{- end }}
{{- end }}
{{- end }}
