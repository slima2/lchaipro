{{- if and .Values.layers.inference .Values.inferenceWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lchai-model-download
data:
  download_models.py: |
    """Descarga los modelos (.pth) del bucket de modelos a /data antes de iniciar el worker.
    Funciona con AWS S3 (credenciales del rol IAM) o con cualquier S3 compatible (MinIO, Ceph)."""
    import os
    import boto3

    endpoint = os.environ.get("S3_ENDPOINT", "")
    kwargs = {"region_name": os.environ.get("MODELS_REGION", "us-east-1")}
    if endpoint and "amazonaws.com" not in endpoint:
        # Las credenciales llegan por variables de entorno (Secret lchai-secrets), nunca en el script
        kwargs["endpoint_url"] = endpoint
        for arg, var in (("access_key_id", "S3_ACCESS_KEY"), ("secret_access_key", "S3_SECRET_KEY")):
            kwargs["aws_" + arg] = os.environ.get(var) or None
    s3 = boto3.client("s3", **kwargs)
    bucket = os.environ["MODELS_BUCKET"]
    only = {n.strip() for n in os.environ.get("MODEL_FILES", "").split(",") if n.strip()}

    for prefix, dest in (("backbones/", "/data/models"), ("checkpoints/", "/data/checkpoints")):
        os.makedirs(dest, exist_ok=True)
        for page in s3.get_paginator("list_objects_v2").paginate(Bucket=bucket, Prefix=prefix):
            for obj in page.get("Contents", []):
                key = obj["Key"]
                name = key.rsplit("/", 1)[-1]
                if not name.endswith(".pth") or "_backup" in key:
                    continue
                if only and prefix == "backbones/" and name not in only:
                    continue
                print(f"Downloading {key}...", flush=True)
                s3.download_file(bucket, key, f"{dest}/{name}")
    print("Done", flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
spec:
  replicas: 1
  {{- with .Values.inferenceWorker.updateStrategy }}
  # Recreate: apaga el worker viejo antes de crear el nuevo. Con RollingUpdate se necesitan dos GPU
  # (o el doble de CPU) durante el cambio, y con una sola GPU el pod nuevo queda Pending para siempre.
  strategy:
    type: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      annotations:
        {{- include "lchai.configChecksum" $ | nindent 8 }}
      labels:
        app: inference-worker
    spec:
      {{- with include "lchai.podHardening" $ }}{{ . | nindent 6 }}{{- end }}
      {{- include "lchai.nodeSelector" (dict "root" $ "pool" (ternary "gpu" "general" .Values.inferenceWorker.gpu)) | nindent 6 }}
      {{- if .Values.inferenceWorker.gpu }}
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      {{- end }}
      initContainers:
        - name: download-models
          image: {{ include "lchai.svcImage" (dict "root" $ "svc" "inference-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "lchai.containerHardening" $ }}{{ . | nindent 10 }}{{- end }}
          command: ["python3", "/scripts/download_models.py"]
          env:
            - name: MODELS_BUCKET
              value: {{ .Values.s3.modelsBucket | quote }}
            - name: MODELS_REGION
              value: {{ .Values.s3.region | quote }}
            - name: MODEL_FILES
              value: {{ .Values.inferenceWorker.modelFiles | default "" | quote }}
          volumeMounts:
            - name: model-data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
            {{- include "lchai.tmpMount" $ | nindent 12 }}
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
      {{- include "lchai.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: inference-worker
          image: {{ include "lchai.svcImage" (dict "root" $ "svc" "inference-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "lchai.containerHardening" $ }}{{ . | nindent 10 }}{{- end }}
          command: ["celery", "-A", "app.celery_app:celery", "worker", "--loglevel=info", "--concurrency=1"]
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
          env:
            - name: CTRANSPATH_CHECKPOINT
              value: "/data/models/ctranspath.pth"
            - name: FUZZYARC_CHECKPOINT
              value: "/data/models/best_fuzzyarcloss_v2.pth"
            - name: V2_CHECKPOINT_DIR
              value: "/data/checkpoints"
          volumeMounts:
            - name: model-data
              mountPath: /data
            {{- include "lchai.tmpMount" $ | nindent 12 }}
          resources:
            requests:
              cpu: {{ .Values.inferenceWorker.resources.requests.cpu | quote }}
              memory: {{ .Values.inferenceWorker.resources.requests.memory }}
              {{- if .Values.inferenceWorker.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
            limits:
              cpu: {{ .Values.inferenceWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.inferenceWorker.resources.limits.memory }}
              {{- if .Values.inferenceWorker.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
      volumes:
        - name: model-data
          emptyDir:
            sizeLimit: 10Gi
        - name: scripts
          configMap:
            name: lchai-model-download
        {{- include "lchai.tmpVolume" $ | nindent 8 }}
{{- end }}
