{{- /* ingress.provider: alb (AWS) | nginx | traefik | generic | none (proxy externo, ver README) */ -}}
{{- if and .Values.layers.app (ne .Values.ingress.provider "none") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lchai-ingress
  annotations:
    {{- if eq .Values.ingress.provider "alb" }}
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.acmCertificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    {{- end }}
    {{- with include "lchai.ingressAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domain | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          {{- /* Con Keycloak externo no hay rutas a Keycloak en este dominio */}}
          {{- if not (include "lchai.kcExternal" .) }}
          - path: /realms/{{ .Values.keycloak.realm }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          {{- if .Values.keycloak.exposeAdmin }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 3000
{{- end }}
