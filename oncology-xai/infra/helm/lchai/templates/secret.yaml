{{- /*
Con secrets.existing=true el chart NO crea lchai-secrets (ni lchai-s3-config con localDeps): el Secret se crea
fuera del chart (kubectl, External Secrets...) con las mismas claves y nunca pasa por git ni por los values.
*/ -}}
{{- if not .Values.secrets.existing }}
{{- $pg := .Values.postgres -}}
{{- $pgPass := required "postgres.password es obligatorio" $pg.password -}}
{{- $sslAsync := $pg.sslMode | default "require" -}}
{{- $rmqPass := required "rabbitmq.password es obligatorio" .Values.rabbitmq.password -}}
{{- $redisAuth := ternary (printf ":%s@" (.Values.redis.password | urlquery)) "" (not (empty .Values.redis.password)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: lchai-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  POSTGRES_DSN: {{ printf "postgresql+asyncpg://%s:%s@%s:%v/%s?ssl=%s" $pg.username ($pgPass | urlquery) $pg.host $pg.port $pg.database $sslAsync | quote }}
  POSTGRES_DSN_SYNC: {{ printf "postgresql://%s:%s@%s:%v/%s?sslmode=%s" $pg.username ($pgPass | urlquery) $pg.host $pg.port $pg.database $sslAsync | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.username | quote }}
  RABBITMQ_PASSWORD: {{ $rmqPass | quote }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq:5672/" .Values.rabbitmq.username ($rmqPass | urlquery) | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
  REDIS_URL: {{ printf "redis://%s%s:%v/0" $redisAuth .Values.redis.host .Values.redis.port | quote }}
  FUSEKI_ADMIN_PASSWORD: {{ required "fuseki.adminPassword es obligatorio" .Values.fuseki.adminPassword | quote }}
  {{- if not (include "lchai.kcExternal" .) }}
  KEYCLOAK_ADMIN_PASSWORD: {{ required "keycloak.adminPassword es obligatorio" .Values.keycloak.adminPassword | quote }}
  {{- end }}
  OPENAI_API_KEY: {{ .Values.openaiApiKey | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | default "" | quote }}
{{- end }}
