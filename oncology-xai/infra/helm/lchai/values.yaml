domain: lchai.gptfy.biz

# Capas a desplegar (para levantar el entorno por partes). Todas encendidas por defecto
layers:
  platform: true    # Keycloak, RabbitMQ, Fuseki
  app: true         # microservicios, webapp e ingress
  inference: true   # worker de inferencia

# URL pública con esquema (y puerto si aplica). Vacío = https://<domain>
publicUrl: ""

image:
  registry: 632100838024.dkr.ecr.us-east-1.amazonaws.com
  prefix: lchai-prod
  # Separador entre prefix y nombre del servicio: "/" (<prefix>/<servicio>) o "-" (<prefix>-<servicio>, p. ej.
  # cuando el registro publica imágenes planas como registry.gitlab.telconet.ec/docker/images/txt-solca-lchai-api-gateway)
  separator: "/"
  tag: latest
  pullPolicy: Always
  # Etiqueta por servicio; si un servicio no aparece, usa image.tag
  tags: {}
  # Secrets de pull adicionales para los pods (p. ej. [harbor-pull-secret]). Se suman a los de la
  # ServiceAccount del namespace. [] = solo los de la ServiceAccount.
  pullSecrets: []

# Selectores de nodo por grupo. {} = sin nodeSelector
nodeSelector:
  general:
    workload: general
  gpu:
    workload: gpu

# StorageClass de los discos persistentes. "" = la clase por defecto del cluster
storage:
  className: gp2
  fixPermissions: false   # true en discos Lustre: initContainer que abre permisos de rabbitmq, fuseki y s3 (corren sin root)

ingress:
  # alb (AWS) | nginx (ingress-nginx, con las anotaciones que lchai necesita) | traefik | generic (cualquier otro)
  # | none (sin Ingress: un proxy externo enruta a los Service, ver infra/minikube/README.md)
  provider: alb
  className: ""
  annotations: {}      # se suman a las del provider y pueden sobrescribirlas
  tls:
    enabled: false     # false si el TLS lo termina un proxy o balanceador delante del cluster
    secretName: ""     # Secret con el certificado de <domain> (lo crea cert-manager si hay clusterIssuer)
    s3SecretName: ""   # certificado del host S3 público (localDeps.s3.host); vacío = <secretName>-s3
    clusterIssuer: ""  # p. ej. letsencrypt-prod: agrega cert-manager.io/cluster-issuer

postgres:
  host: lchai-prod-postgres.cslc0oga28vr.us-east-1.rds.amazonaws.com
  port: 5432
  database: oncology_xai
  username: oncology
  sslMode: require     # asyncpg: require | prefer | disable

# Job que crea o completa las tablas con files/init.sql en cada instalación (idempotente).
# Apagado en AWS (la base ya existe); encendido en minikube y Telconet.
dbSchema:
  enabled: false
  image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/postgres:16.15-r1

redis:
  host: lchai-prod-redis.wgz0ng.0001.use1.cache.amazonaws.com
  port: 6379
  password: ""          # opcional (ElastiCache sin AUTH); obligatoria con localDeps

s3:
  bucket: lchai-prod-artifacts
  region: us-east-1
  modelsBucket: lchai-prod-models
  # Vacío = AWS S3. Para MinIO/Ceph: URL del endpoint (debe ser accesible por el navegador)
  endpoint: ""
  # Endpoint interno (servicio->S3 dentro del cluster). Vacío = con localDeps.enabled usa http://s3:8333;
  # sin localDeps usa s3.endpoint. S3_ENDPOINT_EXTERNAL siempre queda con la URL pública.
  internalEndpoint: ""

acmCertificateArn: "arn:aws:acm:us-east-1:632100838024:certificate/0b8be42a-de6d-4296-ad66-7ded2bf1c263"

# "development" ya no desactiva la autenticación (hace falta AUTH_DEV_BYPASS=true). Usar "production".
environment: production

keycloak:
  realm: oncology
  # Client público del webapp en el realm (el del API es oncology-api, bearer-only)
  webClientId: oncology-webapp
  # Keycloak externo (p. ej. el Keycloak de test del cluster): no se despliega Keycloak en el namespace, ni su Service,
  # ni rutas de Keycloak en el ingress; los servicios validan contra <url>/realms/<realm> y el webapp hace login ahí.
  external:
    enabled: false
    url: ""            # p. ej. https://keycloak.ai-dev.i.telconet.net (sin "/" final)
  # Obligatoria: pasarla con --set keycloak.adminPassword=... (nunca en el repo)
  adminPassword: ""
  image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/keycloak:26.8.1-r2
  # Modo producción detrás del ingress (TLS termina en el ingress; X-Forwarded-* vía KC_PROXY_HEADERS).
  # --optimized: la imagen ya trae el build (postgres + health), no reaugmenta al arrancar.
  args: ["start", "--optimized", "--http-enabled=true", "--hostname-strict=false"]
  # La consola de administración (/admin) y el realm master no se publican por el ingress.
  # Para administrar: kubectl port-forward svc/keycloak 8080:8080
  exposeAdmin: false
  # Usuarios de prueba que se agregan al importar el realm (solo entornos de prueba)
  demoUsers: []
  # Importa infra/keycloak/realm-export.json al arrancar (base de datos nueva)
  importRealm: false

rabbitmq:
  image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/rabbitmq:4.1.8-management-alpine
  username: lchai
  password: ""          # obligatoria (--set)
  replicas: 1
  storage: 5Gi

fuseki:
  image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/fuseki:6.2.0-r2   # Jena Fuseki 6.2.0
  adminPassword: ""     # obligatoria (--set)
  storage: 10Gi

inferenceWorker:
  enabled: true           # false = sin worker en el cluster (worker remoto con GPU: remoteWorker e infra/worker-remoto)
  updateStrategy: ""      # "" = RollingUpdate (AWS). Recreate si hay una sola GPU (Telconet, minikube)
  gpu: true
  modelBackend: local
  maxTilesWsi: 20000
  # Lista de backbones a descargar (ej. "ctranspath.pth,best_fuzzyarcloss_v2.pth"). Vacío = todos
  modelFiles: ""
  # Hilos de PyTorch/OpenMP/MKL del worker. "" = se calcula del limits.cpu (redondeado hacia arriba, minimo 1).
  # Sin esto, en nodos de muchos cores (ej. 448) PyTorch crea un hilo por CPU del nodo (224) y compiten por la
  # cuota CFS del pod: el pre-procesado de tiles se arrastra y la GPU queda ociosa.
  threads: ""
  resources:
    requests: { cpu: "2", memory: 4Gi }
    limits: { cpu: "4", memory: 8Gi }

# Readiness de los servicios Python. http = GET /metrics (o /health), deja una línea de access log cada 15 s por pod;
# tcpSocket = solo comprueba que el puerto acepta conexiones (sin ruido en los logs).
probes:
  type: http

services:
  gateway:
    replicas: 2
  webapp:
    replicas: 2
  caseService:
    replicas: 1
  imageService:
    replicas: 1
  inferenceService:
    replicas: 1
  ehrService:
    replicas: 1
  graphService:
    replicas: 1
  ontologyAdmin:
    replicas: 1
  auditService:
    replicas: 1
  activeLearning:
    replicas: 1

# Worker de IA remoto (p. ej. con GPU en AWS) conectado a este lchai. Ver infra/worker-remoto/README.md.
# Expone RabbitMQ, Redis y PostgreSQL (los de localDeps) SOLO a las IP de allowedCidrs, con el balanceador
# (loadBalancerSourceRanges) y con NetworkPolicy. Pensado para ir por una VPN privada, no por internet abierto.
remoteWorker:
  enabled: false
  serviceType: LoadBalancer   # LoadBalancer | NodePort
  allowedCidrs: []            # obligatorio: IP del worker remoto, p. ej. ["10.20.0.15/32"]
  annotations: {}             # p. ej. balanceador interno del proveedor

# Contraseñas y claves fuera del chart. false = el chart crea lchai-secrets con los values (postgres.password,
# rabbitmq.password, ...). true = el chart NO crea lchai-secrets ni lchai-s3-config: deben existir en el namespace,
# creados por fuera (kubectl, External Secrets), con las claves de templates/secret.yaml y s3.json (SeaweedFS).
# Con true no se pasa ninguna contraseña en los values. Con localDeps y Redis, REDIS_PASSWORD debe ser no vacía.
secrets:
  existing: false

# PostgreSQL, Redis y almacenamiento S3 (SeaweedFS) dentro del cluster (minikube u on-premise sin servicios administrados)
localDeps:
  enabled: false
  postgres:
    image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/postgres:16.15-r1
    storage: 5Gi
    fixPermissions: false   # true en discos Lustre (initContainer root que abre permisos; postgres corre como uid 70)
  redis:
    image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/redis:7-alpine
  s3:
    image: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/seaweedfs:4.52
    awsCliImage: registry.gitlab.telconet.ec/procesos/devops/deploys/txt/solca/lchai/deps/aws-cli:2.39.2
    storage: 20Gi
    host: ""          # host público para las URL firmadas (ingress)
    publicPort: null  # puerto público si no es 80/443 (ej. port-forward 8080)
    # Con 1Gi lo mataba el OOM al subir varias láminas grandes a la vez (migración completa, 2-nov-2026)
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 3Gi }

# Autenticación en el gateway
# Nombres de Deployment/StatefulSet/Job: <workloadPrefix>-<componente>-<workloadSuffix>
# (p. ej. txt-solca-lchai-postgres-pre). Los Service no cambian. Vacíos = nombres simples (api-gateway, postgres...).
workloadPrefix: ""
workloadSuffix: ""

auth:
  jwtIssuer: ""         # vacío = <publicUrl>/realms/<realm> si hay publicUrl
  jwtAudience: ""       # "oncology-api" cuando el realm tiene el mapper de audiencia
  corsOrigins: ""       # vacío = sin CORS (la webapp está en el mismo origen)

webapp:
  cspS3Origin: ""       # vacío = se deduce de s3.endpoint (o AWS S3)

# Imágenes propias sin root ni escalada de privilegios (requiere imágenes sec-20261029 o posteriores).
# Apagado en AWS (sus imágenes de producción corren como root); encendido en Telconet y minikube.
# El token de Kubernetes y el límite de disco temporal de RabbitMQ y Fuseki se aplican siempre.
podSecurity:
  hardened: false

# NetworkPolicies: solo el tráfico necesario entre componentes (requiere un CNI que las aplique)
networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
